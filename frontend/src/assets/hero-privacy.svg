<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title desc">
  <title id="title">Encrypted portfolio protection</title>
  <desc id="desc">A shield and lock guarded by encrypted data blocks, representing privacy by design.</desc>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDFA" />
      <stop offset="100%" stop-color="#CCFBF1" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="55%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0D9488" flood-opacity="0.30" />
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0D9488" flood-opacity="0.25" />
    </filter>
  </defs>

  <rect x="0" y="0" width="800" height="600" rx="24" fill="url(#bg)" />

  <!-- Decorative concentric rings -->
  <circle cx="400" cy="310" r="225" fill="none" stroke="#5EEAD4" stroke-opacity="0.5" stroke-width="2" />
  <circle cx="400" cy="310" r="265" fill="none" stroke="#5EEAD4" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Decorative data dots -->
  <circle cx="120" cy="120" r="6" fill="#2DD4BF" opacity="0.5" />
  <circle cx="690" cy="110" r="5" fill="#14B8A6" opacity="0.5" />
  <circle cx="700" cy="480" r="6" fill="#0D9488" opacity="0.4" />
  <circle cx="95" cy="460" r="5" fill="#2DD4BF" opacity="0.5" />
  <circle cx="260" cy="80" r="4" fill="#99F6E4" />
  <circle cx="560" cy="545" r="4" fill="#99F6E4" />

  <!-- Connection lines from data nodes to shield -->
  <line x1="175" y1="185" x2="310" y2="250" stroke="#14B8A6" stroke-width="3" stroke-dasharray="7 9" stroke-linecap="round" opacity="0.7" />
  <line x1="625" y1="170" x2="495" y2="245" stroke="#14B8A6" stroke-width="3" stroke-dasharray="7 9" stroke-linecap="round" opacity="0.7" />
  <line x1="625" y1="430" x2="490" y2="420" stroke="#14B8A6" stroke-width="3" stroke-dasharray="7 9" stroke-linecap="round" opacity="0.7" />
  <line x1="175" y1="430" x2="310" y2="420" stroke="#14B8A6" stroke-width="3" stroke-dasharray="7 9" stroke-linecap="round" opacity="0.7" />

  <!-- Data node: top-left -->
  <g filter="url(#softShadow)">
    <rect x="105" y="145" width="80" height="80" rx="16" fill="#FFFFFF" stroke="#2DD4BF" stroke-width="3" />
    <rect x="127" y="167" width="36" height="36" rx="8" fill="#CCFBF1" />
    <path d="M145 174 v-7 a 9 9 0 0 1 18 0 v7" fill="none" stroke="#0D9488" stroke-width="4" stroke-linecap="round" />
    <rect x="141" y="174" width="26" height="20" rx="5" fill="#0D9488" />
  </g>

  <!-- Data node: top-right -->
  <g filter="url(#softShadow)">
    <rect x="605" y="130" width="80" height="80" rx="16" fill="#FFFFFF" stroke="#2DD4BF" stroke-width="3" />
    <rect x="627" y="152" width="36" height="36" rx="8" fill="#CCFBF1" />
    <path d="M645 159 v-7 a 9 9 0 0 1 18 0 v7" fill="none" stroke="#0D9488" stroke-width="4" stroke-linecap="round" />
    <rect x="641" y="159" width="26" height="20" rx="5" fill="#0D9488" />
  </g>

  <!-- Data node: bottom-right -->
  <g filter="url(#softShadow)">
    <rect x="615" y="395" width="80" height="80" rx="16" fill="#FFFFFF" stroke="#2DD4BF" stroke-width="3" />
    <rect x="637" y="417" width="36" height="36" rx="8" fill="#CCFBF1" />
    <path d="M655 424 v-7 a 9 9 0 0 1 18 0 v7" fill="none" stroke="#0D9488" stroke-width="4" stroke-linecap="round" />
    <rect x="651" y="424" width="26" height="20" rx="5" fill="#0D9488" />
  </g>

  <!-- Data node: bottom-left -->
  <g filter="url(#softShadow)">
    <rect x="95" y="395" width="80" height="80" rx="16" fill="#FFFFFF" stroke="#2DD4BF" stroke-width="3" />
    <rect x="117" y="417" width="36" height="36" rx="8" fill="#CCFBF1" />
    <path d="M135 424 v-7 a 9 9 0 0 1 18 0 v7" fill="none" stroke="#0D9488" stroke-width="4" stroke-linecap="round" />
    <rect x="131" y="424" width="26" height="20" rx="5" fill="#0D9488" />
  </g>

  <!-- Central shield -->
  <g filter="url(#shadow)">
    <path d="M400 130
             C480 130 535 160 550 215
             C562 262 550 335 400 470
             C250 335 238 262 250 215
             C265 160 320 130 400 130 Z"
          fill="url(#shieldGrad)" />
  </g>

  <!-- Inner shield detail -->
  <path d="M400 175
           C450 175 490 195 500 232
           C508 265 500 315 400 420
           C300 315 292 265 300 232
           C310 195 350 175 400 175 Z"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="3" />

  <!-- Lock -->
  <g filter="url(#softShadow)">
    <!-- shackle -->
    <path d="M366 330 V 304 A 34 34 0 0 1 434 304 V 330" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" />
    <!-- body -->
    <rect x="348" y="322" width="104" height="96" rx="18" fill="#FFFFFF" />
    <!-- keyhole -->
    <circle cx="400" cy="358" r="10" fill="#0D9488" />
    <rect x="392" y="366" width="16" height="30" rx="8" fill="#0D9488" />
  </g>

  <!-- Encrypted hex chips -->
  <g filter="url(#softShadow)">
    <polygon points="235,135 259,122 283,135 283,162 259,175 235,162" fill="#FFFFFF" stroke="#14B8A6" stroke-width="3" />
    <polygon points="259,147 271,154 271,167 259,174 247,167 247,154" fill="#0D9488" opacity="0.25" />
  </g>
  <g filter="url(#softShadow)">
    <polygon points="520,120 544,107 568,120 568,147 544,160 520,147" fill="#FFFFFF" stroke="#14B8A6" stroke-width="3" />
    <polygon points="544,132 556,139 556,152 544,159 532,152 532,139" fill="#0D9488" opacity="0.25" />
  </g>
  <g filter="url(#softShadow)">
    <polygon points="555,485 579,472 603,485 603,512 579,525 555,512" fill="#FFFFFF" stroke="#14B8A6" stroke-width="3" />
    <polygon points="579,497 591,504 591,517 579,524 567,517 567,504" fill="#0D9488" opacity="0.25" />
  </g>
</svg>
